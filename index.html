<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Bigshot Minds — live view of the official website.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg">
<title>Bigshot Minds</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}main{position:fixed;inset:0}iframe{display:block;width:100%;height:100%;height:100dvh;border:0;background:#fff}#fallback{position:fixed;z-index:10;left:12px;right:12px;bottom:12px;max-width:620px;margin:auto;padding:14px 16px;border:1px solid #c7c7c7;border-radius:12px;background:#fff;color:#222;box-shadow:0 4px 22px #0002}#fallback p{margin:0 0 10px;font-size:14px}#fallback a{display:inline-block;padding:10px 14px;border-radius:8px;background:#185abc;color:#fff;text-decoration:none;font-weight:700}#fallback[hidden]{display:none}
</style>
</head>
<body>
<main><iframe id="site" title="Official Bigshot Minds website" src="https://sites.google.com/view/bigshot-minds/home" allow="fullscreen; autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></main>
<div id="fallback" hidden role="status"><p>The original website may block embedded viewing in this browser. Open it directly to see the complete, current website and all content.</p><a href="https://sites.google.com/view/bigshot-minds/home" target="_blank" rel="noopener">Open official Bigshot Minds website</a></div>
<script>
const frame=document.getElementById("site"),fallback=document.getElementById("fallback");
let frameLoaded=false;
frame.addEventListener("load",()=>{frameLoaded=true;fallback.hidden=true});
window.setTimeout(()=>{if(!frameLoaded)fallback.hidden=false},7000);
if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
